:root.light-theme{
  --bg:#f8fafc;

  --text:#0f172a;
  --text2:#475569;
  --text3:#64748b;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);overflow-x:hidden;min-height:100vh}
img{max-width:100%;height:auto;display:block}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
#root{min-height:100vh}

@media (max-width: 1024px){
  .hero-panel{padding:0 32px !important}
}
@media (max-width: 768px){
  .hero-panel{padding:0 20px !important}
  .hero-btns{flex-direction:column !important}
  .hero-btns button{width:100% !important;justify-content:center}
}
@media (max-width: 480px){
  .hero-section{padding-top:96px !important}
  .hero-logo-wrap{width:220px !important;height:220px !important}
}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulse-ring{0%{transform:scale(1);opacity:0.6}100%{transform:scale(1.6);opacity:0}}
@keyframes slide-up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes scan{0%{top:0}100%{top:100%}}
@keyframes glow-pulse{0%,100%{box-shadow:0 0 20px rgba(59,130,246,0.3)}50%{box-shadow:0 0 40px rgba(59,130,246,0.6)}}

.anim-up{animation:slide-up 0.6s ease forwards}
.anim-fade{animation:fade-in 0.4s ease forwards}

.btn-primary{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;border:none;padding:12px 28px;border-radius:10px;
  font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer;
  transition:all 0.3s;position:relative;overflow:hidden;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.4)}
.btn-primary::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.1),transparent);opacity:0;transition:opacity 0.3s}
.btn-primary:hover::after{opacity:1}

.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2);padding:10px 22px;border-radius:8px;font-family:var(--font);font-size:14px;cursor:pointer;transition:all 0.2s}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent2);background:rgba(59,130,246,0.05)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;transition:all 0.3s}
.card:hover{border-color:var(--border2)}

.glass{background:rgba(15,23,42,0.7);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.06)}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.5px}
.badge-blue{background:rgba(59,130,246,0.15);color:#60a5fa;border:1px solid rgba(59,130,246,0.25)}
.badge-green{background:rgba(16,185,129,0.15);color:#34d399;border:1px solid rgba(16,185,129,0.25)}

.line-num{color:var(--text3);min-width:36px;display:inline-block;text-align:right;margin-right:16px;user-select:none;font-size:12px}

def fibonacci(n):
    """Generate Fibonacci sequence up to n terms."""
    if n <= 0:
        return []
    elif n == 1:
        return [0]
    
    sequence = [0, 1]
    while len(sequence) < n:
        next_val = sequence[-1] + sequence[-2]
        sequence.append(next_val)
    
    return sequence

# Main execution
if __name__ == "__main__":
    n = int(input("Enter number of terms: "))
    result = fibonacci(n)
    
    print(f"Fibonacci sequence ({n} terms):")
    print(" → ".join(map(str, result)))`,

function binarySearch(arr, target) {
  let left = 0;
  let right = arr.length - 1;
  
  while (left <= right) {
    const mid = Math.floor((left + right) / 2);
    
    if (arr[mid] === target) {
      return mid;  // Found!
    } else if (arr[mid] < target) {
      left = mid + 1;
    } else {
      right = mid - 1;
    }
  }
  return -1;  // Not found
}

const sortedArr = [2, 5, 8, 12, 16, 23, 38, 56, 72, 91];

const idx = binarySearch(sortedArr, target);

public class BubbleSort {
    
    static void bubbleSort(int[] arr) {
        int n = arr.length;
        for (int i = 0; i < n-1; i++) {
            for (int j = 0; j < n-i-1; j++) {
                if (arr[j] > arr[j+1]) {
                    // Swap elements
                    int temp = arr[j];
                    arr[j] = arr[j+1];
                    arr[j+1] = temp;
                }
            }
        }
    }
    
    public static void main(String[] args) {
        int[] data = {64, 34, 25, 12, 22, 11, 90};
        bubbleSort(data);
        System.out.println("Sorted array:");
        for (int val : data) {
            System.out.print(val + " ");
        }
    }
}`,

struct Node {

    void push(T val) {
        data.push_back(val);
        cout << "Pushed: " << val << endl;
    }
    
    T pop() {
        if (isEmpty()) throw runtime_error("Stack is empty!");
        T top = data.back();
        data.pop_back();
        return top;
    }
    
    bool isEmpty() { return data.empty(); }
    int size() { return data.size(); }
};

int main() {
    Stack<int> stack;
    stack.push(10);
    stack.push(20);
    stack.push(30);
    cout << "Popped: " << stack.pop() << endl;
    return 0;
}`,
};

const API_BASE = "/api";

const MONACO_LANGUAGE_MAP = {
  python: 'python',
  js: 'javascript',
  java: 'java',
  c: 'c',
  cpp: 'cpp'
};

const getMonacoLanguage = (language) => MONACO_LANGUAGE_MAP[language] || language || 'python';

const getFallbackReply = (message) => {
  const text = (message || '').toLowerCase();
  if (text.includes('recursion')) {
    return 'Recursion becomes clearer when you identify the base case first. Ask: what is the smallest input that can be solved directly, and how does a larger case become a smaller one?';
  }
  if (text.includes('big-o') || text.includes('time complexity')) {
    return 'Big-O describes how runtime grows as input grows. Count the loops, especially nested loops, and describe the growth in terms of input size.';
  }
  if (text.includes('binary search')) {
    return 'Binary search works best on sorted data. Keep cutting the search space in half until you find the target or prove it is absent.';
  }
  if (text.includes('pointer') || text.includes('c')) {
    return 'In C, pointers hold addresses. Try to picture the memory location each pointer references before changing the code.';
  }
  if (text.includes('error') || text.includes('debug')) {
    return 'For debugging, reproduce the issue with a small example, trace the variable values step by step, and test the edge cases.';
  }
  return 'I can help you reason through this step by step. Start by naming the input, the expected output, and the edge case you need to handle first.';
};

if (window.require && typeof window.require.config === 'function') {
  window.require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs' }});

const formatDisplayName = (user) => {
  if (!user) return 'Student User';
  if (user.fullName) return user.fullName;
  const first = user.firstName || '';
  const last = user.lastName || '';
  const full = `${first} ${last}`.trim();
  return full || 'Student User';
};

const getInitials = (name) => {
  return name.split(/\s+/).filter(Boolean).map(word => word[0].toUpperCase()).slice(0,2).join('') || 'ST';
};

const formatDeadline = (value) => {
  if (!value) return 'No deadline';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value;
  return date.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
};

const getDeadlineState = (value) => {
  if (!value) return { color: 'var(--text2)', label: 'No deadline' };
  const deadline = new Date(value);
  if (Number.isNaN(deadline.getTime())) return { color: 'var(--text2)', label: value };
  const expired = deadline < new Date();
  return expired
    ? { color: 'var(--red)', label: `Expired • ${formatDeadline(value)}` }
    : { color: '#f59e0b', label: `Due • ${formatDeadline(value)}` };
};

const apiRequest = async (endpoint, method = "POST", body = null) => {
  const headers = { "Content-Type": "application/json" };
  const token = localStorage.getItem('authToken');
  if (token) headers.Authorization = `Bearer ${token}`;

  const options = { method, headers };
  if (body) options.body = JSON.stringify(body);

  const response = await fetch(`${API_BASE}${endpoint}`, options);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    throw new Error(data.message || "Backend request failed");
  }
  return data;
};

// ─── CODE EDITOR ───────────────────────────────────────────────────
function CodeEditor({user}){
  const [lang,setLang]=useState('python');
  const [code,setCode]=useState(CODE_SAMPLES.python);
  const [output,setOutput]=useState('');
  const [running,setRunning]=useState(false);
  const [aiOpen,setAiOpen]=useState(true);
  const [aiMessages,setAiMessages]=useState([
    {role:'ai',text:"Hello! I'm your JNTUA Labs AI Assistant. I can explain concepts, give hints, and help you debug — but I won't write code for you. What are you working on?"},
  ]);
  const [aiInput,setAiInput]=useState('');
  const [activeTab,setActiveTab]=useState(0);
  const [showInput,setShowInput]=useState(false);
  const [stdin,setStdin]=useState('');
  const editorContainerRef=useRef(null);
  const monacoEditorRef=useRef(null);
  const monacoRef=useRef(null);

  const tabs=[
    {name:'main.py',lang:'python'},
    {name:'utils.py',lang:'python'},
    {name:'test.py',lang:'python'},
  ];

  useEffect(()=>{setCode(CODE_SAMPLES[lang]||'# Write your code here\n');},[lang]);

  useEffect(()=>{
    const loadMonaco = () => {
      if (!window.require || !window.require.config) return;
      if (!editorContainerRef.current) return;

      window.require(['vs/editor/editor.main'], monaco => {
        monacoRef.current = monaco;
        if (monacoEditorRef.current) return;

        monacoEditorRef.current = monaco.editor.create(editorContainerRef.current, {
          value: code,
          language: getMonacoLanguage(lang),
          theme: document.body.classList.contains('light-theme') ? 'vs' : 'vs-dark',
          automaticLayout: true,
          minimap: { enabled: false },
          fontFamily: 'JetBrains Mono, monospace',
          fontSize: 13,
          lineNumbers: 'on',
          scrollBeyondLastLine: false,
          wordWrap: 'on'
        });

        monacoEditorRef.current.onDidChangeModelContent(() => {
          const value = monacoEditorRef.current.getValue();
          setCode(value);
        });
      });
    };

    loadMonaco();

    return () => {
      if (monacoEditorRef.current) {
        monacoEditorRef.current.dispose();
        monacoEditorRef.current = null;
      }
    };
  }, []);

  useEffect(() => {
    if (monacoEditorRef.current && monacoEditorRef.current.getValue() !== code) {
      monacoEditorRef.current.setValue(code);
    }
  }, [code]);

  useEffect(() => {
    if (monacoRef.current && monacoEditorRef.current) {
      const model = monacoEditorRef.current.getModel();
      if (model) {
        monacoRef.current.editor.setModelLanguage(model, getMonacoLanguage(lang));
      }
    }
  }, [lang]);

  const runCode=async ()=>{
    setRunning(true);
    setOutput('');
    const lines=['Compiling...','Running program...'];
    let i=0;
    const interval=setInterval(()=>{
      if(i<lines.length){setOutput(p=>p+lines[i]+'\n');i++;}
    },500);

    try {
      const payload = { language: lang, code, stdin, questionId: 1 };
      if(user && user.userId){
        payload.userId = user.userId;
      }
      const result = await apiRequest('/submissions/submit', 'POST', payload);
      clearInterval(interval);
      setOutput(result.output || result.message || 'Execution completed.');
    } catch (err) {
      clearInterval(interval);
      setOutput(err.message || 'Execution failed.');
    } finally {
      setRunning(false);
    }
  };

  const sendAiMessage=async ()=>{
    if(!aiInput.trim())return;
    const q=aiInput.trim();
    const history=[...aiMessages,{role:'user',text:q}];
    setAiMessages(history);
    setAiInput('');

    try {
      const data = await apiRequest('/ai/chat', 'POST', {
        message: q,
        conversationHistory: history.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', text: m.text }))
      });
      setAiMessages([...history,{role:'ai',text:data.message || getFallbackReply(q)}]);
    } catch (err) {
      setAiMessages([...history,{role:'ai',text:getFallbackReply(q)}]);
    }
  };

  const lineCount=code.split('\n').length;

  return(
    <div style={{animation:'slide-up 0.4s ease',height:'calc(100vh - 116px)',display:'flex',flexDirection:'column',gap:0}}>
      {/* EDITOR TOPBAR */}
      <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderBottom:'none',borderRadius:'14px 14px 0 0',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 16px'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{display:'flex',gap:6}}>
            <div style={{width:12,height:12,borderRadius:'50%',background:'#ef4444'}}/>
            <div style={{width:12,height:12,borderRadius:'50%',background:'#f59e0b'}}/>
            <div style={{width:12,height:12,borderRadius:'50%',background:'#10b981'}}/>
          </div>
          <div style={{width:1,height:20,background:'var(--border)',margin:'0 6px'}}/>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <Icon name="folder" size={14} color='var(--text3)'/>
            <span style={{fontSize:12,color:'var(--text3)',fontFamily:'var(--mono)'}}>lab-session-4</span>
            <span style={{color:'var(--text3)'}}>/</span>
          </div>
        </div>

        {/* LANGUAGE SELECTOR */}
        <div style={{display:'flex',gap:6}}>
          {LANGUAGES.map(l=>(
            <button key={l.id} onClick={()=>setLang(l.id)} style={{display:'flex',alignItems:'center',gap:5,padding:'5px 10px',borderRadius:7,border:'none',background:lang===l.id?l.bg:'transparent',color:lang===l.id?l.color:'var(--text3)',fontFamily:'var(--font)',fontSize:12,fontWeight:600,cursor:'pointer',transition:'all 0.2s'}}>
              <span style={{fontSize:13}}>{l.icon}</span>{l.name}
            </button>
          ))}
        </div>

        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <button className="btn-ghost" style={{padding:'6px 12px',fontSize:12,display:'flex',alignItems:'center',gap:5}} onClick={()=>setShowInput(!showInput)}>
            <Icon name="terminal" size={13}/>stdin
          </button>

function AIAssistant(){
  const [messages,setMessages]=useState([
    {role:'ai',text:"Hi! I'm your JNTUA Labs AI mentor. I can explain concepts, suggest debugging steps, and help you think through a problem without giving away the full solution. What are you working on?"},
  ]);
  const [input,setInput]=useState('');
  const [typing,setTyping]=useState(false);
  const suggestions=['Explain recursion','What is Big-O notation?','How does binary search work?','Explain pointers in C','What is OOP?','Dynamic programming tips'];

  const send=async ()=>{
    if(!input.trim())return;
    const q=input.trim();
    const history=[...messages,{role:'user',text:q}];
    setMessages(history);
    setInput('');setTyping(true);

    try {
      const data = await apiRequest('/ai/chat','POST', {
        message: q,
        conversationHistory: history.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', text: m.text }))
      });
      setTyping(false);
      setMessages([...history,{role:'ai',text:data.message || getFallbackReply(q)}]);
    } catch (err) {
      setTyping(false);
      setMessages([...history,{role:'ai',text:getFallbackReply(q)}]);
    }
  };

  return(
    <div style={{animation:'slide-up 0.5s ease',height:'calc(100vh - 120px)',display:'flex',flexDirection:'column'}}>
      <div style={{marginBottom:20}}>
        <h1 style={{fontFamily:'var(--display)',fontSize:24,fontWeight:800,letterSpacing:'-0.5px',marginBottom:4}}>AI Learning Assistant</h1>
        <p style={{color:'var(--text2)',fontSize:14}}>Ask anything about programming. Your mentor guides — you code.</p>
      </div>
      <div className="card" style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{flex:1,overflow:'auto',padding:24,display:'flex',flexDirection:'column',gap:16}}>
          {messages.map((m,i)=>(
            <div key={i} style={{display:'flex',gap:12,flexDirection:m.role==='user'?'row-reverse':'row',animation:'slide-up 0.3s ease'}}>
              <div style={{width:32,height:32,borderRadius:10,background:m.role==='ai'?'linear-gradient(135deg,#8b5cf6,#3b82f6)':'linear-gradient(135deg,#3b82f6,#10b981)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:2}}>
                <Icon name={m.role==='ai'?'bot':'star'} size={14} color='#fff'/>
              </div>
              <div style={{maxWidth:'70%',padding:'14px 18px',borderRadius:14,background:m.role==='user'?'rgba(59,130,246,0.12)':'var(--bg2)',border:`1px solid ${m.role==='user'?'rgba(59,130,246,0.2)':'var(--border)'}`,fontSize:14,lineHeight:1.7}}>
                {m.text}
              </div>
            </div>
          ))}
          {typing&&(
            <div style={{display:'flex',gap:12}}>
              <div style={{width:32,height:32,borderRadius:10,background:'linear-gradient(135deg,#8b5cf6,#3b82f6)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <Icon name="bot" size={14} color='#fff'/>
              </div>
              <div style={{padding:'14px 18px',borderRadius:14,background:'var(--bg2)',border:'1px solid var(--border)'}}>
                <div style={{display:'flex',gap:5,alignItems:'center'}}>
                  {[0,1,2].map(i=><div key={i} style={{width:7,height:7,borderRadius:'50%',background:'var(--text3)',animation:`blink 1s ${i*0.2}s infinite`}}/>)}
                </div>
              </div>
            </div>
          )}
        </div>
        <div style={{padding:'16px 20px',borderTop:'1px solid var(--border)'}}>
          <div style={{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap'}}>
            {suggestions.map(s=>(
              <button key={s} onClick={()=>setInput(s)} style={{fontSize:12,padding:'5px 10px',borderRadius:20,background:'rgba(59,130,246,0.08)',border:'1px solid rgba(59,130,246,0.2)',color:'#60a5fa',cursor:'pointer',fontFamily:'var(--font)',transition:'all 0.2s'}} onMouseOver={e=>e.currentTarget.style.background='rgba(59,130,246,0.15)'} onMouseOut={e=>e.currentTarget.style.background='rgba(59,130,246,0.08)'}>
                {s}
              </button>
            ))}
          </div>
          <div style={{display:'flex',gap:10}}>
            <input type="text" placeholder="Ask a concept, request a hint, or describe a problem..." value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} style={{flex:1,height:44,fontSize:14}}/>
            <button onClick={send} className="btn-primary" style={{padding:'0 20px',flexShrink:0,display:'flex',alignItems:'center',gap:6}}>
              <Icon name="send" size={15}/>Send
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ProgressPage(){
  const [progress,setProgress]=useState(null);
  const [loading,setLoading]=useState(true);
  const [userName,setUserName]=useState('Student');

  useEffect(()=>{
    try {
      const savedUser = JSON.parse(localStorage.getItem('user') || 'null');
      const studentId = savedUser?.userId || savedUser?.id;
      setUserName(formatDisplayName(savedUser));
      if (!studentId) {
        setLoading(false);
        return;
      }

      apiRequest(`/progress/${studentId}`, 'GET')
        .then((data) => setProgress(data || {}))
        .catch(() => setProgress({}))
        .finally(() => setLoading(false));
    } catch (err) {
      setLoading(false);
    }
  }, []);

  const solved = Number(progress?.solved_questions || 0);
  const total = Number(progress?.total_questions || 0);
  const totalMarks = Number(progress?.total_marks || 0);
  const acceptanceRate = total ? Math.round((solved / total) * 100) : 0;
  const streak = Math.min(12, Math.max(1, solved || 1));
  const weekData = [Math.min(100, 40 + solved), Math.min(100, 50 + solved * 2), Math.min(100, 35 + solved * 3), Math.min(100, 60 + solved), Math.min(100, 70 + solved), Math.min(100, 55 + solved), Math.min(100, 65 + solved)];
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const skillRows=[
    {name:'Accepted solutions',level:total ? Math.round((solved/total)*100) : 0,color:'#10b981'},
    {name:'Submission strength',level:Math.min(100, Math.round((solved + 1) * 5)),color:'#3b82f6'},
    {name:'Marks earned',level:Math.min(100, Math.round(totalMarks / Math.max(1, total) * 10)),color:'#f59e0b'},
    {name:'Consistency',level:Math.min(100, streak * 8),color:'#8b5cf6'},
  ];

  return(
    <div style={{animation:'slide-up 0.5s ease'}}>
      <div style={{marginBottom:24}}>
        <h1 style={{fontFamily:'var(--display)',fontSize:24,fontWeight:800,letterSpacing:'-0.5px',marginBottom:4}}>My Progress</h1>
        <p style={{color:'var(--text2)',fontSize:14}}>Personal progress for {userName} from your signed-up activity</p>
      </div>
      {loading ? <div style={{color:'var(--text2)'}}>Loading your progress...</div> : (
        <>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginBottom:20}}>
            <div className="card" style={{padding:24}}>
              <div style={{fontWeight:700,fontSize:15,marginBottom:20}}>Learning profile</div>
              {skillRows.map(s=>(
                <div key={s.name} style={{marginBottom:16}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                    <span style={{fontSize:13,fontWeight:500}}>{s.name}</span>
                    <span style={{fontSize:13,fontWeight:700,color:s.color}}>{s.level}%</span>
                  </div>
                  <div className="progress-bar">
                    <div className="progress-fill" style={{width:`${s.level}%`,background:s.color}}/>
                  </div>
                </div>
              ))}
            </div>
            <div className="card" style={{padding:24}}>
              <div style={{fontWeight:700,fontSize:15,marginBottom:20}}>Weekly activity</div>
              <div style={{display:'flex',gap:8,alignItems:'flex-end',height:140}}>
                {weekData.map((v,i)=>(
                  <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
                    <div style={{width:'100%',background:'linear-gradient(to top,#3b82f6,#8b5cf6)',borderRadius:'4px 4px 0 0',height:`${v}%`,transition:'height 0.8s ease',minHeight:4}}/>
                    <span style={{fontSize:10,color:'var(--text3)',fontWeight:500}}>{days[i]}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:16}}>
            {[['Total Problems', String(total), 'assigned'],['Acceptance Rate', `${acceptanceRate}%`, 'current'],['Best Streak', `${streak} days`, 'active'],['Total Marks', String(totalMarks), 'earned']].map(([l,v,s])=>(
              <div key={l} className="stat-card">
                <span className="stat-label">{l}</span>
                <div className="stat-value" style={{color:'var(--accent2)',fontSize:24}}>{v}</div>
                <div style={{fontSize:12,color:'var(--text3)'}}>{s}</div>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function QuestionManager(){
  const [showForm,setShowForm]=useState(false);
  const [questions,setQuestions]=useState([]);
  const [title,setTitle]=useState('');
  const [description,setDescription]=useState('');
  const [language,setLanguage]=useState('Python');
  const [difficulty,setDifficulty]=useState('Easy');
  const [subject,setSubject]=useState('DSA');
  const [marks,setMarks]=useState('');
  const [assignDate,setAssignDate]=useState('');
  const [assignTime,setAssignTime]=useState('');
  const [deadlineDate,setDeadlineDate]=useState('');
  const [deadlineTime,setDeadlineTime]=useState('');
  const [sampleInput,setSampleInput]=useState('');
  const [sampleOutput,setSampleOutput]=useState('');
  const [loading,setLoading]=useState(false);
  const [message,setMessage]=useState('');
  const [error,setError]=useState('');

  useEffect(()=>{
    fetchQuestions();
  },[]);

  const fetchQuestions=async()=>{
    setLoading(true);
    try{
      const data = await apiRequest('/questions','GET');
      setQuestions(Array.isArray(data)?data:data.questions||[]);
    }catch(err){
      console.error('Failed to load questions', err);
      setError('Unable to load questions');
    }finally{
      setLoading(false);
    }
  };

  const handleSaveQuestion=async()=>{
    setError('');
    setMessage('');
    if(!title.trim()||!description.trim()||!marks.trim()){
      setError('Title, description, and marks are required.');
      return;
    }

    setLoading(true);
    try{
      await apiRequest('/questions/add','POST',{
        title,
        description,
        language,
        difficulty,
        subject,
        marks: Number(marks) || 0,
        sampleInput,
        sampleOutput,
        assignDate,
        assignTime,
        deadlineDate,
        deadlineTime
      });
      setMessage('Question added successfully.');
      setShowForm(false);
      setTitle('');
      setDescription('');
      setSubject('DSA');
      setMarks('');
      setAssignDate('');
      setAssignTime('');
      setDeadlineDate('');
      setDeadlineTime('');
      setSampleInput('');
      setSampleOutput('');
      fetchQuestions();
    }catch(err){
      setError(err.message || 'Failed to save question.');
    }finally{
      setLoading(false);
    }
  };

  const diffColors={Easy:'green',Medium:'amber',Hard:'red'};
  return(
    <div style={{animation:'slide-up 0.5s ease'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:24}}>
        <div>
          <h1 style={{fontFamily:'var(--display)',fontSize:24,fontWeight:800,marginBottom:4}}>Question Bank</h1>
          <p style={{color:'var(--text2)',fontSize:14}}>Manage and assign problems to students</p>
        </div>
        <button className="btn-primary" style={{display:'flex',alignItems:'center',gap:6}} onClick={()=>setShowForm(!showForm)}>
          <Icon name="plus" size={15}/>Add Question
        </button>
      </div>
      {showForm&&(
        <div className="card" style={{padding:28,marginBottom:20}}>
          <div style={{fontWeight:700,fontSize:16,marginBottom:20,fontFamily:'var(--display)'}}>New Question</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
            <div><label>Question Title</label><input type="text" placeholder="e.g. Reverse a Linked List" value={title} onChange={e=>setTitle(e.target.value)}/></div>
            <div><label>Language</label>
              <select value={language} onChange={e=>setLanguage(e.target.value)} style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:10,color:'var(--text)',fontFamily:'var(--font)',fontSize:14,padding:'12px 16px',width:'100%',outline:'none'}}>
                {LANGUAGES.map(l=><option key={l.id} value={l.name}>{l.name}</option>)}
              </select>
            </div>
            <div><label>Difficulty</label>
              <select value={difficulty} onChange={e=>setDifficulty(e.target.value)} style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:10,color:'var(--text)',fontFamily:'var(--font)',fontSize:14,padding:'12px 16px',width:'100%',outline:'none'}}>
                <option>Easy</option><option>Medium</option><option>Hard</option>
              </select>
            </div>
            <div><label>Subject</label>
              <select value={subject} onChange={e=>setSubject(e.target.value)} style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:10,color:'var(--text)',fontFamily:'var(--font)',fontSize:14,padding:'12px 16px',width:'100%',outline:'none'}}>
                <option value="DSA">DSA</option>
                <option value="Python">Python</option>
                <option value="Java">Java</option>
                <option value="C Programming">C Programming</option>
                <option value="Web Development">Web Development</option>
              </select>
            </div>
            <div><label>Marks</label><input type="text" placeholder="e.g. 20" value={marks} onChange={e=>setMarks(e.target.value)}/></div>
            <div><label>Assign Date</label><input type="date" value={assignDate} onChange={e=>setAssignDate(e.target.value)} style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:10,color:'var(--text)',fontFamily:'var(--font)',fontSize:14,padding:'12px 16px',width:'100%',outline:'none'}}/></div>
            <div><label>Assign Time</label><input type="time" value={assignTime} onChange={e=>setAssignTime(e.target.value)} style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:10,color:'var(--text)',fontFamily:'var(--font)',fontSize:14,padding:'12px 16px',width:'100%',outline:'none'}}/></div>
            <div><label>Deadline Date</label><input type="date" value={deadlineDate} onChange={e=>setDeadlineDate(e.target.value)} style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:10,color:'var(--text)',fontFamily:'var(--font)',fontSize:14,padding:'12px 16px',width:'100%',outline:'none'}}/></div>
            <div><label>Deadline Time</label><input type="time" value={deadlineTime} onChange={e=>setDeadlineTime(e.target.value)} style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:10,color:'var(--text)',fontFamily:'var(--font)',fontSize:14,padding:'12px 16px',width:'100%',outline:'none'}}/></div>
          </div>
          <div style={{marginTop:16}}><label>Problem Statement</label>
            <textarea value={description} onChange={e=>setDescription(e.target.value)} placeholder="Describe the problem clearly with constraints..." style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:10,color:'var(--text)',fontFamily:'var(--font)',fontSize:14,padding:'12px 16px',width:'100%',height:120,resize:'vertical',outline:'none'}}/>
          </div>
          <div style={{marginTop:16}}>
            <label>Sample Input / Output</label>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
              <textarea value={sampleInput} onChange={e=>setSampleInput(e.target.value)} placeholder="Sample Input:\n5\n1 2 3 4 5" style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:10,color:'var(--text)',fontFamily:'var(--mono)',fontSize:13,padding:'12px',height:80,resize:'none',outline:'none'}}/>
              <textarea value={sampleOutput} onChange={e=>setSampleOutput(e.target.value)} placeholder="Expected Output:\n5 4 3 2 1" style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:10,color:'var(--text)',fontFamily:'var(--mono)',fontSize:13,padding:'12px',height:80,resize:'none',outline:'none'}}/>
            </div>
          </div>
          {error && <div style={{color:'#ef4444',fontSize:13,marginTop:12}}>{error}</div>}
          {message && <div style={{color:'#34d399',fontSize:13,marginTop:12}}>{message}</div>}
          <div style={{display:'flex',gap:10,marginTop:20}}>
            <button className="btn-primary" onClick={handleSaveQuestion} disabled={loading} style={{padding:'10px 24px'}}>{loading?'Saving...':'Save Question'}</button>
            <button className="btn-ghost" onClick={()=>setShowForm(false)}>Cancel</button>
          </div>
        </div>
      )}
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {questions.map(q=>(
          <div key={q.id} className="card" style={{padding:'16px 20px',display:'flex',flexDirection:'column',gap:10}}>
            <div style={{display:'flex',alignItems:'center',gap:16}}>
              <span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text3)',minWidth:40}}>{q.id}</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:15,marginBottom:4}}>{q.title}</div>
                <div style={{display:'flex',gap:8}}>
                  <span className={`badge badge-${diffColors[q.difficulty||'Easy']}`}>{q.difficulty||'Easy'}</span>
                  <span className="badge badge-blue">{q.language||'Python'}</span>
                  {q.subject && <span className="badge badge-purple">{q.subject}</span>}
                  <span style={{fontSize:11,color:'var(--text3)'}}>⭐ {q.marks} marks</span>
                </div>
              </div>
              <span className={`badge badge-${q.assigned?'green':'amber'}`}>{q.assigned?'Assigned':'Draft'}</span>
              <div style={{display:'flex',gap:6}}>
                <button className="btn-ghost" style={{padding:'6px 10px'}}><Icon name="edit" size={13}/></button>
                <button className="btn-ghost" style={{padding:'6px 10px',color:'var(--red)',borderColor:'rgba(239,68,68,0.2)'}}><Icon name="trash" size={13} color='var(--red)'/></button>
              </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,paddingTop:10,borderTop:'1px solid var(--border)'}}>
              <div style={{fontSize:12}}>
                <span style={{color:'var(--text3)',fontWeight:600}}>Assign Date:</span>
                <div style={{color:'var(--text)',marginTop:2}}>{q.assign_date || 'Not set'}</div>
              </div>
              <div style={{fontSize:12}}>
                <span style={{color:'var(--text3)',fontWeight:600}}>Deadline:</span>
                <div style={{color:getDeadlineState(q.deadline).color,marginTop:2,fontWeight:600}}>{getDeadlineState(q.deadline).label}</div>
              </div>
              <div style={{fontSize:12}}>
                <span style={{color:'var(--text3)',fontWeight:600}}>Faculty:</span>
                <div style={{color:'var(--text)',marginTop:2}}>{q.faculty_name || 'Current faculty'}</div>
              </div>
              <div style={{fontSize:12}}>
                <span style={{color:'var(--text3)',fontWeight:600}}>Status:</span>
                <div style={{color:'var(--text)',marginTop:2}}>{q.deadline && new Date(q.deadline) < new Date() ? 'Expired' : 'Active'}</div>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

    const newTheme=theme==='dark'?'light':'dark';
    setTheme(newTheme);
    if(newTheme==='light'){
      document.documentElement.classList.add('light-theme');
    }else{
      document.documentElement.classList.remove('light-theme');
    }
    localStorage.setItem('theme',newTheme);
  };

  useEffect(()=>{
    const savedTheme=localStorage.getItem('theme')||'dark';
    setTheme(savedTheme);
    if(savedTheme==='light'){
      document.documentElement.classList.add('light-theme');
    }
  },[]);

  const handleLogin=(userData)=>{localStorage.setItem('authToken', userData.token);localStorage.setItem('user', JSON.stringify(userData));setUser(userData);setView('dashboard');};
  const handleLogout=()=>{localStorage.removeItem('authToken');localStorage.removeItem('user');setUser(null);setView('landing');};

  useEffect(()=>{
    if (localStorage.getItem('authToken') && !user) {
      try {
        const saved = localStorage.getItem('user');
        if (saved) setUser(JSON.parse(saved));
      } catch (err) {}
    }
  }, [user]);

  if(view==='landing')return<LandingPage onNavigate={setView} onToggleTheme={toggleTheme} theme={theme}/>;
  if(view==='login')return<LoginPage onNavigate={setView} onLogin={handleLogin} onToggleTheme={toggleTheme} theme={theme}/>;
  if(view==='register')return<RegisterPage onNavigate={setView} onToggleTheme={toggleTheme} theme={theme}/>;
  if(view==='dashboard'){
    if(!user) return<LandingPage onNavigate={setView} onToggleTheme={toggleTheme} theme={theme}/>;
    if(user.role==='faculty')return<FacultyDashboard onLogout={handleLogout} onToggleTheme={toggleTheme} theme={theme} user={user}/>;
    if(user.role==='admin')return<AdminDashboard onLogout={handleLogout} onToggleTheme={toggleTheme} theme={theme}/>;
    return<StudentDashboard onNavigate={setView} onLogout={handleLogout} onToggleTheme={toggleTheme} theme={theme} user={user}/>;
  }
  return<LandingPage onNavigate={setView} onToggleTheme={toggleTheme} theme={theme}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
